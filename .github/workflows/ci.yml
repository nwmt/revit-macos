name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:   # a newer push to a pull request cancels its older run; every push to main keeps its own
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    # the sandbox suites side by side, on the runner the job check has (macOS on Apple Silicon, /bin/bash 3.2);
    # revit-cli.sh in two halves (TEST_PART)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: revit-cli 1/2
            run: TEST_PART=1 tests/revit-cli.sh
          - name: revit-cli 2/2
            run: TEST_PART=2 tests/revit-cli.sh
          - name: steps
            run: tests/steps.sh
          - name: plans, shims, smoke, app
            run: tests/plans.sh && tests/shims.sh && tests/smoke.sh && tests/app.sh
    name: sandbox (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - name: 7-Zip, as in the job check
        run: command -v 7zz >/dev/null || brew install sevenzip
      - name: Pinned test fixtures (the job check saves them; tests/fixtures.sh checks each sha256)
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/revit-macos-tests
          key: test-fixtures-${{ hashFiles('tests/*.sh', 'tests/*.py') }}
          restore-keys: test-fixtures-
      - name: Sandbox tests (/bin/bash 3.2)
        run: ${{ matrix.run }}

  check:
    # macOS on Apple Silicon: the same /bin/bash 3.2, sips and toolchain users have
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # commit message check walks the PR range
      - name: Repo rules (paths, binaries, English-only, personal data, bash syntax)
        run: .githooks/check-tree
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          for c in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$c" > msg.txt
            .githooks/commit-msg msg.txt || { echo "bad message in $c"; exit 1; }
          done
      - name: Pinned prebuilt shims match the sources
        run: |
          . scripts/lib/shims.sh
          git diff --quiet "v$SHIMS_VERSION" -- "${SHIMS_SOURCES[@]}" || echo "::warning::shim sources changed since v$SHIMS_VERSION: tag a release and bump scripts/lib/shims.sh (until then install.sh builds from source)"
      - name: Python helpers compile
        run: python3 -I -m py_compile tools/*.py tools/shims/ncryptshim/gen_forwards.py tests/test_tools.py
      - name: 7-Zip for the installer tests (tools/installer_source.py reads a fake Create Installer with 7zz)
        run: command -v 7zz >/dev/null || brew install sevenzip
      - name: Pinned test fixtures for the Python tests (tests/fixtures.sh checks each sha256)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/revit-macos-tests
          key: test-fixtures-${{ hashFiles('tests/*.sh', 'tests/*.py') }}
          restore-keys: test-fixtures-
      - name: Python helper tests
        run: python3 -I -B -m unittest discover -s tests -p 'test_*.py'
      - name: Python helper tests under the system Python (3.9, what a Mac with only the Command Line Tools has)
        run: |
          if [ -x /usr/bin/python3 ] && /usr/bin/python3 -c 'import sys' 2>/dev/null; then
            /usr/bin/python3 -I -B -m unittest discover -s tests -p 'test_*.py'
          else
            echo "::warning::no /usr/bin/python3 on this runner: the tests did not run under 3.9"
          fi
      - name: Build all shims, as a release does
        run: ./scripts/build-release.sh ci
      - name: install.sh refuses cleanly without CrossOver and installers
        run: |
          if INSTALL_DRYRUN=1 ./install.sh 2020 > out.txt 2>&1; then cat out.txt; exit 1; fi
          cat out.txt
          grep -q "CrossOver not found" out.txt

  swift:
    # the menu bar app's Swift tests (app/test.sh): the engine of this repo in a sandbox, no CrossOver, no Revit
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: 7-Zip for the engine's installer checks
        run: command -v 7zz >/dev/null || brew install sevenzip
      - name: Swift version
        run: swift --version
      - name: Swift tests
        run: app/test.sh
