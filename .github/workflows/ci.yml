name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS on Apple Silicon: the same /bin/bash 3.2, sips and toolchain users have
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # commit message check walks the PR range
      - name: Repo rules (paths, binaries, English-only, personal data, bash syntax)
        run: .githooks/check-tree
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          for c in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$c" > msg.txt
            .githooks/commit-msg msg.txt || { echo "bad message in $c"; exit 1; }
          done
      - name: Pinned prebuilt shims match the sources
        run: |
          . scripts/lib/shims.sh
          git diff --quiet "v$SHIMS_VERSION" -- "${SHIMS_SOURCES[@]}" || echo "::warning::shim sources changed since v$SHIMS_VERSION: tag a release and bump scripts/lib/shims.sh (until then install.sh builds from source)"
      - name: Python helpers compile
        run: python3 -I -m py_compile tools/*.py tools/shims/ncryptshim/gen_forwards.py tests/test_tools.py
      - name: 7-Zip for the installer tests (tools/installer_source.py reads a fake Create Installer with 7zz)
        run: command -v 7zz >/dev/null || brew install sevenzip
      - name: Sandbox tests (/bin/bash 3.2)
        run: |
          tests/revit-cli.sh
          tests/plans.sh
          tests/steps.sh
          tests/shims.sh
          tests/app.sh
      - name: Python helper tests
        run: python3 -I -m unittest discover -s tests -p 'test_*.py'
      - name: Build all shims, as a release does
        run: ./scripts/build-release.sh ci
      - name: install.sh refuses cleanly without CrossOver and installers
        run: |
          if INSTALL_DRYRUN=1 ./install.sh 2020 > out.txt 2>&1; then cat out.txt; exit 1; fi
          cat out.txt
          grep -q "CrossOver not found" out.txt
