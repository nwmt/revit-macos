# The app's identity, in one place: app/*.sh, the bundle, its Info.plist, the DMG and .github/workflows/app.yml read it.
# Sourced by bash. The name is provisional: change it here only (it also names ~/Library/Application Support/<name>).
APP_NAME='Mac BIM Dock'
APP_BUNDLE_ID='io.github.nwmt.macbimdock'
APP_MIN_MACOS=27.0   # the trackpad helper's permission flow was checked on 27 only; 7-Zip's binary needs 26.0
APP_REPO='nwmt/revit-macos'   # the GitHub repository: Help, update checks (owner/name)
# The trackpad helper (Contents/Helpers/<APP_NAME> Trackpad.app) has its own version: macOS ties its permission to the
# helper's code, so the helper changes only when it has to. app/build.sh checks its CDHash against the one recorded here
# (app/check-helper-cdhash.sh): a new one means a new helper, a new TRACKPAD_HELPER_VERSION, and users grant again.
TRACKPAD_HELPER_VERSION=1.0.0
TRACKPAD_HELPER_CDHASH='90479662caabf2b328e8764b8441f251357d9e81'
