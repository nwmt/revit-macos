# The app's identity, in one place: app/*.sh, the bundle, its Info.plist, the DMG and .github/workflows/app.yml read it.
# Sourced by bash. The name is provisional: change it here only (it also names ~/Library/Application Support/<name>).
APP_NAME='Mac BIM Dock'
APP_BUNDLE_ID='io.github.nwmt.macbimdock'
APP_MIN_MACOS=26.0   # 7-Zip's macOS binary (app/tools.sh) is built for 26.0 (LC_BUILD_VERSION minos)
APP_REPO='nwmt/revit-macos'   # the GitHub repository: Help, update checks (owner/name)
